  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }

  function generateBuildingOptions() {
    return buildings.map(b => `<option value="${b}">${b}</option>`).join('');
  }

  function generateCategoryOptions() {
    return categories.map(c => `<option value="${c.value}">${c.label}</option>`).join('');
  }


  function buildFormSection(index, dateStr, meal) {
    const prefix = `${meal}_${index}`;
    const mealLabel = meal === 'lunch' ? '午餐' : meal === 'dinner' ? '晚餐' : '早餐';
    return`
    <div class="section-box">
      <h5>${dateStr} - ${mealLabel}</h5>
      <div class="mb-3">
        <label class="form-label">建築物</label>
        <select name="building_${prefix}" class="form-select" required>
          <option value="">請選擇</option>
          ${buildings.map(b => `<option value="${b}">${b}</option>`).join('')}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">距離（公里）</label>
        <input type="number" name="distance_${prefix}" step="0.1" value="0.5" class="form-control" required>
       </div>
      <div class="mb-3">
        <label class="form-label">預算</label>
        <select name="budget_${prefix}" class="form-select">
          <option value="$">$</option>
          <option value="$$">$$</option>

        </select>
      </div>

        <label class="form-label">餐廳類別（可多選）</label>

          ${categories.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
}

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('end_date').addEventListener('change', () => {
      const start = document.getElementById('start_date').value;
      const end = document.getElementById('end_date').value;
      const container = document.getElementById('daily-forms');
      container.innerHTML = '';

      const selectedMeals = [];
      if (document.getElementById('breakfast_check').checked) selectedMeals.push('breakfast');
      if (document.getElementById('lunch_check').checked) selectedMeals.push('lunch');
      if (document.getElementById('dinner_check').checked) selectedMeals.push('dinner');

      if (start && end && selectedMeals.length > 0) {
        const startDate = new Date(start);
        const endDate = new Date(end);
        let index = 0;
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
          const dateStr = formatDate(d);
          selectedMeals.forEach(meal => {
            container.innerHTML += buildFormSection(index, dateStr, meal);
          });
          index++;
        }
      }
    });
  });
