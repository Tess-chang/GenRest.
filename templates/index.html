<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>GenRest 餐廳推薦</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fff;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 3px solid #234E70;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.8rem;
        }
        .nav-link {
            font-size: 1.1rem;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            border: 3px solid #234E70;
            margin: 30px auto;
            max-width: 800px;
            position: relative;
            border-radius: 16px;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .hero p {
            font-size: 1.2rem;
        }
        .hero img {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 100px;
            opacity: 0.2;
        }
        .genrest-btn {
            background-color: #234E70;
            color: white;
            padding: 10px 20px;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
        }
        .genrest-btn:hover {
            background-color: #1a3a55;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand" href="/">GenRest.</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="/">首頁</a>
            </li>
            <li class="nav-item">

            </li>
            <li class="nav-item">
                <a class="nav-link" href="/account">記帳</a>
            </li>
        </ul>
    </div>
</nav>

<section class="hero">
    <h1>吃飯時間到囉！！</h1>
    <p>剛下課不知道要吃什麼嗎？<br>我來幫你決定</p>
    <a href="/recommend" class="genrest-btn">→ GenRest.</a>
    <img src="/static/台大校徽.png" alt="台大校徽">
