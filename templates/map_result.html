<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>多天 餐廳推薦</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; }
    .btn-primary { background-color: #234E70; border: none; font-weight: bold; }
    .pink { background-color: #ffe4e1; }
    table { width: 100%; text-align: center; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ccc; }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBbTwYoF3iRq1ZVC41_BNNTkf5qED06oik&libraries=places"></script>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">多天 餐廳推薦：每日輸入</h2>
    <form method="POST" action="/generate_map_schedule">
      <div class="mb-3">
        <label for="distance" class="form-label">可接受的距離（公里）</label>
        <input type="number" step="0.1" name="global_distance" class="form-control pink" required>
      </div>
      <div class="mb-3">
        <label for="budget" class="form-label">你的預算</label>
        <select name="global_budget" class="form-select pink">
          <option value="$">$</option>
          <option value="$$">$$</option>
          <option value="$$$">$$$</option>
          <option value="$$$$">$$$$</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>餐別 / 日期</th>
            <th>5/21 (星期二)</th>
            <th>5/22 (星期三)</th>
            <th>5/23 (星期四)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>午餐</th>
            <td>
              <input id="place_lunch_0" name="place_lunch_0" class="form-control pink" placeholder="搜尋地點">
            </td>
            <td>
              <input id="place_lunch_1" name="place_lunch_1" class="form-control pink" placeholder="搜尋地點">
            </td>
            <td>
              <input id="place_lunch_2" name="place_lunch_2" class="form-control pink" placeholder="搜尋地點">
            </td>
          </tr>
          <tr>
            <th>晚餐</th>
            <td>
              <input id="place_dinner_0" name="place_dinner_0" class="form-control pink" placeholder="搜尋地點">
            </td>
            <td>
              <input id="place_dinner_1" name="place_dinner_1" class="form-control pink" placeholder="搜尋地點">
            </td>
            <td>
              <input id="place_dinner_2" name="place_dinner_2" class="form-control pink" placeholder="搜尋地點">
            </td>
          </tr>
        </tbody>
      </table>
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary">生成餐廳</button>
      </div>
    </form>
  </div>

  <script>
    function initAutocomplete() {
      const ids = [
        'place_lunch_0', 'place_lunch_1', 'place_lunch_2',
        'place_dinner_0', 'place_dinner_1', 'place_dinner_2'
      ];
      ids.forEach(id => {
        const input = document.getElementById(id);
        if (input) {
          new google.maps.places.Autocomplete(input);
        }
      });
    }
    google.maps.event.addDomListener(window, 'load', initAutocomplete);
  </script>
</body>
</html>
